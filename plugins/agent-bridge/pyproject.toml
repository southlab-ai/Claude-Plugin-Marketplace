[project]
name = "southlab-agent-bridge"
version = "0.1.0"
description = "Blocking request/reply bridge between independent Codex or Claude chats"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

